# set Ctrl-Space as the prefix
unbind-key C-b 
set-option -g prefix C-Space
bind-key C-Space send prefix

#unbind-key C-Space
#set-option -g prefix C-b
#bind-key C-b send prefix

# allow mouse
set -g mouse on

# vim-like pane resizing  
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

unbind C-up
unbind C-down
unbind C-left
unbind C-right

# vim-like pane switching
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

unbind up
unbind down
unbind left
unbind right

# set new panes to open in home directory
bind c new-window -c "$HOME"
bind b split-window -c "$HOME"
bind v split-window -h -c "$HOME"

# set new panes to open in current directory with Ctrl
bind C-c new-window -c "#{pane_current_path}"
bind C-b split-window -c "#{pane_current_path}"
bind C-v split-window -h -c "#{pane_current_path}"

set -g focus-events on

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

set-option -sg escape-time 10
set-option -g default-terminal "tmux-256color"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# vi mode
set-window-option -g mode-keys vi

set -g @col "color105"

# neutral borders for unfocused panes
set -g pane-border-style fg=colour236
# vivid border for the active pane
set -g pane-active-border-style fg=color240

## STATUSBAR # TODO: different keybind?
bind-key C-x set-option status

set -g status-position bottom
set -g status-style 'bg=default fg=colour250'

set-option -g status "on"
set-window-option -g window-status-separator ""

# show only the session name on the left, with its own background
set -g status-left-length 20
set -g status-left '#[bg=#{@col},fg=#f0f0f0,bold] #S #[bg=default,fg=colour250]'

set-option -g status-right "%Y-%m-%d  %H:%M  #(~/.config/tmux/tmux-battery.sh)  #[bg=#{@col},fg=#f0f0f0] #h"

set-window-option -g window-status-current-format "#[bg=color235,fg=color250]#[bold] #I #W#{?window_zoomed_flag,*Z,} #[nobold]"
set-window-option -g window-status-format "#[bg=default,fg=color242] #I #W "

# MESSAGES
set -g message-style 'bg=colour221 fg=colour232 bold'
set-option -g display-time 1500


# vim: set ft=tmux tw=0 nowrap:


# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
# Restore Panes
set -g @resurrect-capture-pane-contents 'on'
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'
## Restore last saved environment (automatically)
#set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
